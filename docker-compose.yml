version: "3.9"
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "8000:8000"
    env_file:
      - server/.env
  web:
    build:
      context: .
      dockerfile: Dockerfile.client
    ports:
      - "3000:3000"
    environment:
      - CHAT_BACKEND_URL=http://api:8000
    depends_on:
      - api