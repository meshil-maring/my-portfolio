name: API Keep-Alive

on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping keep-alive endpoint (touches Supabase)
        env:
          API_KEEPALIVE_URL: ${{ secrets.API_KEEPALIVE_URL }}
        run: |
          if [ -z "$API_KEEPALIVE_URL" ]; then
            echo "API_KEEPALIVE_URL secret is not set" >&2
            exit 1
          fi
          for i in 1 2 3; do
            if curl -fsS --max-time 30 "$API_KEEPALIVE_URL" -o /tmp/keepalive.json; then
              cat /tmp/keepalive.json
              exit 0
            fi
            echo "attempt $i failed; retrying in 5s" >&2
            sleep 5
          done
          echo "keep-alive endpoint unreachable" >&2
          exit 1
